name: Backport to mainphp7

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'backport-php7')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Config git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get commit list from merged PR
        id: commits
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              }
            );
            const shas = commits.map(c => c.sha);
            core.setOutput('shas', shas.join(' '));
            core.setOutput('pr_number', pr.number);
            core.setOutput('pr_title', pr.title);

      - name: Create backport branch from mainphp7
        id: branch
        run: |
          BRANCH="backport/pr-${{ steps.commits.outputs.pr_number }}-to-mainphp7"
          git fetch origin mainphp7
          git checkout -b "$BRANCH" origin/mainphp7
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Cherry-pick commits
        id: cherrypick
        continue-on-error: true
        run: |
          set +e
          FAILED=""
          for sha in ${{ steps.commits.outputs.shas }}; do
            echo "Cherry-picking $sha"
            git cherry-pick "$sha"
            if [ $? -ne 0 ]; then
              echo "Conflict on $sha, committing with conflict markers left in place for manual resolution"
              git add -A
              GIT_EDITOR=true git cherry-pick --continue
              FAILED="$FAILED $sha"
            fi
          done
          echo "failed_shas=$FAILED" >> "$GITHUB_OUTPUT"
          if [ -n "$FAILED" ]; then
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find files with unresolved conflict markers
        id: conflictfiles
        run: |
          FILES=$(grep -rl "^<<<<<<<" --exclude-dir=.git . || true)
          if [ -n "$FILES" ]; then
            {
              echo "files<<EOF"
              echo "$FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "files=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for new commits
        id: diffcheck
        run: |
          COUNT=$(git rev-list --count origin/mainphp7..HEAD)
          echo "Commits ahead of origin/mainphp7: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Push backport branch
        if: steps.diffcheck.outputs.count != '0'
        run: |
          git push origin "${{ steps.branch.outputs.branch }}" --force

      - name: Create PR to mainphp7
        id: create_pr
        if: steps.diffcheck.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = "${{ steps.branch.outputs.branch }}";
            const prNumber = "${{ steps.commits.outputs.pr_number }}";
            const prTitle = "${{ steps.commits.outputs.pr_title }}";
            const failed = "${{ steps.cherrypick.outputs.failed_shas }}".trim();
            const hasConflicts = "${{ steps.cherrypick.outputs.has_conflicts }}" === 'true';
            const conflictFiles = `${{ steps.conflictfiles.outputs.files }}`.trim();

            let body = `Automated backport from PR #${prNumber} (\`${prTitle}\`) into \`mainphp7\`.\n\n`;

            if (hasConflicts) {
              body += `⚠️ **Some commits had conflicts. They were committed with conflict markers left in place so they show up directly in this PR's diff:**\n`;
              failed.split(' ').forEach(sha => {
                if (sha) body += `- ${sha}\n`;
              });

              if (conflictFiles) {
                body += `\n**Files still containing conflict markers (\`<<<<<<<\`):**\n`;
                conflictFiles.split('\n').forEach(f => {
                  if (f) body += `- \`${f.replace(/^\.\//, '')}\`\n`;
                });
              }

              body += `\nPlease pull branch \`${branch}\`, resolve the conflict markers manually, commit, and push before merging. This PR is opened as a draft to prevent accidental merge.`;
            } else {
              body += `All commits were cherry-picked successfully with no conflicts.`;
            }

            const newPr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Backport] ${prTitle} -> mainphp7`,
              head: branch,
              base: 'mainphp7',
              body: body,
              draft: hasConflicts,
            });

            core.setOutput('pr_url', newPr.data.html_url);
            core.setOutput('pr_number_new', newPr.data.number);

      - name: Comment back on original PR
        uses: actions/github-script@v7
        with:
          script: |
            const originalPrNumber = "${{ steps.commits.outputs.pr_number }}";
            const backportPrUrl = "${{ steps.create_pr.outputs.pr_url }}";
            const branch = "${{ steps.branch.outputs.branch }}";
            const hasConflicts = "${{ steps.cherrypick.outputs.has_conflicts }}" === 'true';
            const noNewCommits = "${{ steps.diffcheck.outputs.count }}" === '0';
            const failed = "${{ steps.cherrypick.outputs.failed_shas }}".trim();

            let message;
            if (noNewCommits) {
              message = `❌ Backport to \`mainphp7\` failed: no new commits ended up on the backport branch (nothing to cherry-pick, or everything was already present). No branch was pushed and no PR was opened.`;
            } else if (hasConflicts) {
              message = `⚠️ Backport PR created for \`mainphp7\`, but some commits had conflicts. Conflict markers were left in place directly in the PR diff for manual resolution: ${backportPrUrl}\n\nBranch: \`${branch}\`\nConflicting commits:${failed}`;
            } else {
              message = `✅ Backport PR created for \`mainphp7\`: ${backportPrUrl}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(originalPrNumber, 10),
              body: message,
            });
