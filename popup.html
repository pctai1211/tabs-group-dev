<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Grouper</title>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }

        h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #333;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        #groupBtn {
            background-color: #4CAF50;
            color: white;
        }

        #groupBtn:hover {
            background-color: #45a049;
        }

        #ungroupBtn {
            background-color: #f44336;
            color: white;
        }

        #ungroupBtn:hover {
            background-color: #da190b;
        }

        .divider {
            height: 1px;
            background-color: #ddd;
            margin: 15px 0;
        }

        .toggle-section {
            margin-bottom: 12px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .toggle-label {
            font-size: 14px;
            color: #333;
            flex-grow: 1;
        }

        .toggle-description {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        /* Custom Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4CAF50;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        #status {
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        #status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <h3>🗂️ Tab Grouper test</h3>

    <div class="button-group">
        <button id="groupBtn">Nhóm tabs theo domain</button>
        <button id="ungroupBtn">Gỡ tất cả nhóm</button>
    </div>

    <div class="divider"></div>

    <div class="toggle-section">
        <div class="toggle-container">
            <div>
                <div class="toggle-label">Tự động nhóm tabs</div>
                <div class="toggle-description">Tự động group khi mở tab mới</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="autoGroupToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="toggle-section">
        <div class="toggle-container">
            <div>
                <div class="toggle-label">Khôi phục tabs</div>
                <div class="toggle-description">Mở lại tabs đã lưu của domain</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="restorePersistentToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>

</html>
